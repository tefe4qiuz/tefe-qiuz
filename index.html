
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEFE-QUIZ | Online Examination</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #172554;
}

header {
    background: #142b52;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    font-size: 30px;
}

header p {
    margin-top: 8px;
    color: #cbd5e1;
}

main {
    max-width: 850px;
    margin: 45px auto;
    padding: 20px;
    text-align: center;
}

.welcome {
    margin-bottom: 30px;
}

.welcome h2 {
    font-size: 26px;
    margin-bottom: 12px;
}

.portals {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.portal {
    background: white;
    padding: 30px 20px;
    border-radius: 14px;
    box-shadow: 0 4px 15px #00000012;
}

.portal h3 {
    font-size: 21px;
    margin-bottom: 12px;
}

.portal p {
    color: #64748b;
    line-height: 1.6;
}

footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
}
</style>
</head>

<body>

<header>
    <h1>TEFE-QUIZ</h1>
    <p>Online Examination Platform</p>
</header>

<main>
    <section class="welcome">
        <h2>Welcome to TEFE-QUIZ</h2>
        <p>Your online examination platform.</p>
    </section>

    <section class="portals">

        <div class="portal">
            <h3>Student Portal</h3>
            <p>Access examinations, answer questions
            and view your results.</p>
        </div>

        <div class="portal">
            <h3>Admin Portal</h3>
            <p>Manage students, create examinations
            and monitor results.</p>
        </div>

    </section>
</main>

<footer>
    &copy; 2026 TEFE-QUIZ. All rights reserved.
</footer>

</body>
  </html>
